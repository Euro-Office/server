name: Redis and Valkey editor data tests

on:
  push:
    branches:
      - '**'
    paths:
      # Storage implementations and all production callers that can select
      # or mutate editor-data/editor-stat state.
      - 'DocService/sources/editorDataRedis/**'
      - 'DocService/sources/editorDataRedis.js'
      - 'DocService/sources/editorDataMemory.js'
      - 'DocService/sources/DocsCoServer.js'
      - 'DocService/sources/canvasservice.js'
      - 'DocService/sources/savedState.js'
      - 'DocService/sources/server.js'
      - 'DocService/sources/routes/info.js'
      - 'DocService/sources/changes2forgotten.js'
      - 'DocService/sources/shutdown.js'
      - 'DocService/sources/gc.js'
      - 'DocService/sources/expirationConfig.js'
      - 'Common/sources/notificationService.js'
      - 'Common/sources/constants.js'
      - 'Common/sources/commondefines.js'
      - 'Common/config/default.json'
      - 'Common/package.json'
      - 'Common/npm-shrinkwrap.json'
      - 'DocService/package.json'
      - 'DocService/npm-shrinkwrap.json'
      - 'tests/jest.config.js'
      - 'tests/env-setup.js'
      - 'tests/redis/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/redisEditorDataTests.yml'
      - '.github/workflows/unitTests.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      # Keep push and pull-request coverage identical.
      - 'DocService/sources/editorDataRedis/**'
      - 'DocService/sources/editorDataRedis.js'
      - 'DocService/sources/editorDataMemory.js'
      - 'DocService/sources/DocsCoServer.js'
      - 'DocService/sources/canvasservice.js'
      - 'DocService/sources/savedState.js'
      - 'DocService/sources/server.js'
      - 'DocService/sources/routes/info.js'
      - 'DocService/sources/changes2forgotten.js'
      - 'DocService/sources/shutdown.js'
      - 'DocService/sources/gc.js'
      - 'DocService/sources/expirationConfig.js'
      - 'Common/sources/notificationService.js'
      - 'Common/sources/constants.js'
      - 'Common/sources/commondefines.js'
      - 'Common/config/default.json'
      - 'Common/package.json'
      - 'Common/npm-shrinkwrap.json'
      - 'DocService/package.json'
      - 'DocService/npm-shrinkwrap.json'
      - 'tests/jest.config.js'
      - 'tests/env-setup.js'
      - 'tests/redis/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/redisEditorDataTests.yml'
      - '.github/workflows/unitTests.yml'
      - '.github/workflows/e2e.yml'

jobs:
  prepare_editor_data_matrix:
    name: Prepare Redis and Valkey editor data matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sentinel_matrix: ${{ steps.matrix.outputs.sentinel_matrix }}

    steps:
      - id: matrix
        run: |
          echo 'matrix={"include":[{"name":"redis-7.0.15","image":"redis:7.0.15-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"redis-7.2","image":"redis:7.2-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"redis-8","image":"redis:8-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"valkey-7.2","image":"valkey/valkey:7.2-alpine","server_command":"valkey-server","cli_command":"valkey-cli"},{"name":"valkey-8","image":"valkey/valkey:8-alpine","server_command":"valkey-server","cli_command":"valkey-cli"}]}' >> "$GITHUB_OUTPUT"
          base_matrix='[{"name":"redis-7.0.15","image":"redis:7.0.15-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"redis-7.2","image":"redis:7.2-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"redis-8","image":"redis:8-alpine","server_command":"redis-server","cli_command":"redis-cli"},{"name":"valkey-7.2","image":"valkey/valkey:7.2-alpine","server_command":"valkey-server","cli_command":"valkey-cli"},{"name":"valkey-8","image":"valkey/valkey:8-alpine","server_command":"valkey-server","cli_command":"valkey-cli"}]'
          echo "sentinel_matrix=$(jq -c '{include: [ .[] as \$item | [\"password\", \"unauthenticated\", \"acl\"][] | \$item + {auth: .} ]}' <<< \"$base_matrix\")" >> "$GITHUB_OUTPUT"

  redis-editor-data-tests:
    name: ${{ matrix.name }} standalone editor data tests
    runs-on: ubuntu-latest
    needs: prepare_editor_data_matrix

    env:
      REDIS_TEST_PASSWORD: 'redis-editor-data-password'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_editor_data_matrix.outputs.matrix) }}

    steps:
      - name: Start ${{ matrix.name }} standalone service
        run: |
          set -euo pipefail
          docker run --name "${{ matrix.name }}-standalone" --network host -d \
            --health-cmd "${{ matrix.cli_command }} -a redis-editor-data-password ping" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            "${{ matrix.image }}" "${{ matrix.server_command }}" \
            --port 6379 --bind 127.0.0.1 --protected-mode no --appendonly no \
            --requirepass "$REDIS_TEST_PASSWORD"

      - name: Check ${{ matrix.name }} standalone service health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "${{ matrix.name }}-standalone")
            if [ "$health" = healthy ]; then
              exit 0
            fi
            test "$attempt" -lt 30 || {
              docker logs "${{ matrix.name }}-standalone"
              exit 1
            }
            sleep 1
          done

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci

      - name: Run ${{ matrix.name }} standalone editor data tests
        env:
          TEST_REDIS_NODE_PASSWORD: ${{ env.REDIS_TEST_PASSWORD }}
          TEST_REDIS_PREFIX: 'ci:editor-data:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: |
          echo "Running ${{ matrix.name }} standalone editor-data tests"
          npm run tests -- --runInBand ../tests/redis

      - name: Run ${{ matrix.name }} standalone failure-policy integration test
        env:
          TEST_REDIS_NODE_PASSWORD: ${{ env.REDIS_TEST_PASSWORD }}
          TEST_REDIS_FAILURE_CONTAINER: '${{ matrix.name }}-standalone'
          TEST_REDIS_PREFIX: 'ci:editor-data-failure:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: npm run tests -- --runInBand ../tests/redis/editorDataRedis.failure.integration.tests.js

      - name: Clean up ${{ matrix.name }} standalone service
        if: always()
        run: docker rm -f "${{ matrix.name }}-standalone" || true

  redis-editor-data-no-password-tests:
    name: Redis standalone editor data tests without a password
    runs-on: ubuntu-latest

    steps:
      - name: Start no-password Redis service
        run: |
          docker run --name redis-editor-data-no-password --network host -d redis:7-alpine \
            redis-server --port 6379 --bind 127.0.0.1 --protected-mode no --appendonly no

      - name: Check no-password Redis service health
        run: |
          for attempt in $(seq 1 30); do
            if docker exec redis-editor-data-no-password redis-cli -p 6379 ping | grep -qx PONG; then
              exit 0
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci

      - name: Run no-password standalone editor data tests
        env:
          TEST_REDIS_PREFIX: 'ci:editor-data-no-password:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: npm run tests -- --runInBand ../tests/redis

      - name: Clean up no-password Redis service
        if: always()
        run: docker rm -f redis-editor-data-no-password || true

  redis-editor-data-cluster-tests:
    name: ${{ matrix.name }} Cluster editor data tests
    runs-on: ubuntu-latest
    needs: prepare_editor_data_matrix

    env:
      REDIS_TEST_PASSWORD: 'redis-editor-data-password'
      TEST_REDIS_CLUSTER: 'true'
      TEST_REDIS_NODE_PASSWORD: 'redis-editor-data-password'
      TEST_REDIS_CLUSTER_NODES: 'redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002'
      TEST_REDIS_PREFIX: 'ci:editor-data-cluster:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_editor_data_matrix.outputs.matrix) }}

    steps:
      - name: Start ${{ matrix.name }} Cluster nodes
        run: |
          set -euo pipefail
          container_prefix="${{ matrix.name }}-cluster"
          for port in 7000 7001 7002 7003 7004 7005; do
            docker run --name "${container_prefix}-$port" --network host -d "${{ matrix.image }}" \
              "${{ matrix.server_command }}" --port "$port" --bind 127.0.0.1 --protected-mode no \
              --cluster-enabled yes --cluster-config-file "nodes-$port.conf" \
              --cluster-node-timeout 5000 --appendonly no \
              --requirepass "$REDIS_TEST_PASSWORD" --masterauth "$REDIS_TEST_PASSWORD" \
              --cluster-announce-ip 127.0.0.1 \
              --cluster-announce-port "$port" \
              --cluster-announce-bus-port "$((port + 10000))"
          done
          for port in 7000 7001 7002 7003 7004 7005; do
            for attempt in $(seq 1 30); do
              docker exec "${container_prefix}-7000" "${{ matrix.cli_command }}" \
                -h 127.0.0.1 -p "$port" -a "$REDIS_TEST_PASSWORD" ping && break
              test "$attempt" -lt 30 || exit 1
              sleep 1
            done
          done
          docker exec "${container_prefix}-7000" "${{ matrix.cli_command }}" -a "$REDIS_TEST_PASSWORD" --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
            --cluster-replicas 1 \
            --cluster-yes

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci

      - name: Run ${{ matrix.name }} Cluster editor data tests
        run: |
          echo "Running ${{ matrix.name }} Cluster editor-data tests"
          npm run tests -- --runInBand --testPathPattern=redis --testPathIgnorePatterns=editorDataRedis.process.tests.js

      - name: Run ${{ matrix.name }} Cluster independent-process editor data tests
        run: |
          echo "Running ${{ matrix.name }} Cluster independent-process editor-data tests"
          npm run tests -- --runInBand --testPathPattern=redis/editorDataRedis.process.tests.js

      - name: Run ${{ matrix.name }} Cluster promotion and reconnect integration test
        env:
          TEST_REDIS_TOPOLOGY_REQUIRED: 'true'
          TEST_REDIS_CLUSTER_FAILOVER_REPLICA_PORT: '7005'
          TEST_REDIS_PREFIX: 'ci:editor-data-cluster-failover:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: npm run tests -- --runInBand ../tests/redis/editorDataRedis.topology.tests.js

      - name: Clean up ${{ matrix.name }} Cluster nodes
        if: always()
        run: docker rm -f \
          "${{ matrix.name }}-cluster-7000" \
          "${{ matrix.name }}-cluster-7001" \
          "${{ matrix.name }}-cluster-7002" \
          "${{ matrix.name }}-cluster-7003" \
          "${{ matrix.name }}-cluster-7004" \
          "${{ matrix.name }}-cluster-7005" || true

  redis-editor-data-sentinel-tests:
    name: ${{ matrix.name }} Sentinel editor data tests
    runs-on: ubuntu-latest
    needs: prepare_editor_data_matrix

    env:
      REDIS_TEST_PASSWORD: 'redis-editor-data-password'
      REDIS_TEST_SENTINEL_PASSWORD: 'sentinel-editor-data-password'
      REDIS_TEST_NODE_USERNAME: 'redis-editor-user'
      REDIS_TEST_SENTINEL_USERNAME: 'sentinel-editor-user'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_editor_data_matrix.outputs.sentinel_matrix) }}

    steps:
      - name: Start ${{ matrix.name }} Sentinel topology
        run: |
          set -euo pipefail
          container_prefix="${{ matrix.name }}-sentinel-${{ matrix.auth }}"
          case "${{ matrix.auth }}" in
            password)
              docker run --name "${container_prefix}-primary" --network host -d "${{ matrix.image }}" \
                "${{ matrix.server_command }}" --port 6380 --bind 127.0.0.1 --protected-mode no \
                --appendonly no --requirepass "$REDIS_TEST_PASSWORD"
              docker run --name "${container_prefix}-replica" --network host -d "${{ matrix.image }}" \
                "${{ matrix.server_command }}" --port 6381 --bind 127.0.0.1 --protected-mode no \
                --appendonly no --requirepass "$REDIS_TEST_PASSWORD" \
                --masterauth "$REDIS_TEST_PASSWORD" --replicaof 127.0.0.1 6380
              ;;
            unauthenticated)
              docker run --name "${container_prefix}-primary" --network host -d "${{ matrix.image }}" \
                "${{ matrix.server_command }}" --port 6380 --bind 127.0.0.1 --protected-mode no --appendonly no
              docker run --name "${container_prefix}-replica" --network host -d "${{ matrix.image }}" \
                "${{ matrix.server_command }}" --port 6381 --bind 127.0.0.1 --protected-mode no --appendonly no \
                --replicaof 127.0.0.1 6380
              ;;
            acl)
              for role in primary replica; do
                port=6380
                replica_args=''
                [ "$role" = replica ] && port=6381 && replica_args="--masteruser $REDIS_TEST_NODE_USERNAME --masterauth $REDIS_TEST_PASSWORD --replicaof 127.0.0.1 6380"
                docker run --name "${container_prefix}-${role}" --network host -d "${{ matrix.image }}" sh -c \
                  "printf '%s\\n' 'user default off' 'user ${REDIS_TEST_NODE_USERNAME} on >${REDIS_TEST_PASSWORD} ~* &* +@all' > /tmp/users.acl && exec ${{ matrix.server_command }} --port $port --bind 127.0.0.1 --protected-mode no --appendonly no --aclfile /tmp/users.acl $replica_args"
              done
              ;;
            *) exit 1 ;;
          esac
          for sentinel_port in 26379 26380 26381; do
            if [ "${{ matrix.auth }}" = password ]; then
              sentinel_acl=''
              sentinel_server_args=''
              sentinel_auth="requirepass ${REDIS_TEST_SENTINEL_PASSWORD}\\nsentinel auth-pass mymaster ${REDIS_TEST_PASSWORD}"
            elif [ "${{ matrix.auth }}" = unauthenticated ]; then
              sentinel_acl=''
              sentinel_server_args=''
              sentinel_auth=''
            else
              sentinel_acl="printf '%s\\n' 'user default off' 'user ${REDIS_TEST_SENTINEL_USERNAME} on >${REDIS_TEST_SENTINEL_PASSWORD} ~* &* +@all' > /tmp/users.acl && "
              sentinel_server_args='--aclfile /tmp/users.acl'
              sentinel_auth="sentinel auth-user mymaster ${REDIS_TEST_NODE_USERNAME}\\nsentinel auth-pass mymaster ${REDIS_TEST_PASSWORD}"
            fi
            docker run --name "${container_prefix}-${sentinel_port}" --network host -d "${{ matrix.image }}" \
              sh -c "${sentinel_acl}printf '%b\\n' \
                'port ${sentinel_port}' 'bind 127.0.0.1' 'protected-mode no' \
                'sentinel monitor mymaster 127.0.0.1 6380 2' \
                \"${sentinel_auth}\" \
                'sentinel down-after-milliseconds mymaster 1000' \
                'sentinel failover-timeout mymaster 5000' \
                'sentinel parallel-syncs mymaster 1' \
                > /tmp/sentinel.conf && exec ${{ matrix.server_command }} /tmp/sentinel.conf --sentinel $sentinel_server_args"
          done

          if [ "${{ matrix.auth }}" = password ]; then
            redis_cli_auth=(-a "$REDIS_TEST_PASSWORD")
            sentinel_cli_auth=(-a "$REDIS_TEST_SENTINEL_PASSWORD")
            {
              echo "TEST_REDIS_NODE_PASSWORD=$REDIS_TEST_PASSWORD"
              echo "TEST_REDIS_SENTINEL_PASSWORD=$REDIS_TEST_SENTINEL_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "${{ matrix.auth }}" = acl ]; then
            redis_cli_auth=(--user "$REDIS_TEST_NODE_USERNAME" -a "$REDIS_TEST_PASSWORD")
            sentinel_cli_auth=(--user "$REDIS_TEST_SENTINEL_USERNAME" -a "$REDIS_TEST_SENTINEL_PASSWORD")
            {
              echo "TEST_REDIS_NODE_USERNAME=$REDIS_TEST_NODE_USERNAME"
              echo "TEST_REDIS_NODE_PASSWORD=$REDIS_TEST_PASSWORD"
              echo "TEST_REDIS_SENTINEL_USERNAME=$REDIS_TEST_SENTINEL_USERNAME"
              echo "TEST_REDIS_SENTINEL_PASSWORD=$REDIS_TEST_SENTINEL_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            redis_cli_auth=()
            sentinel_cli_auth=()
          fi

          for attempt in $(seq 1 30); do
            if docker exec "${container_prefix}-primary" "${{ matrix.cli_command }}" "${redis_cli_auth[@]}" -p 6380 ping | grep -qx PONG \
              && docker exec "${container_prefix}-replica" "${{ matrix.cli_command }}" "${redis_cli_auth[@]}" -p 6381 ping | grep -qx PONG; then
              break
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done

          for sentinel_port in 26379 26380 26381; do
            for attempt in $(seq 1 30); do
              if docker exec "${container_prefix}-${sentinel_port}" "${{ matrix.cli_command }}" \
                "${sentinel_cli_auth[@]}" -p "$sentinel_port" ping | grep -qx PONG; then
                break
              fi
              test "$attempt" -lt 30 || exit 1
              sleep 1
            done
          done

          for attempt in $(seq 1 30); do
            master_host=$(docker exec "${container_prefix}-26379" "${{ matrix.cli_command }}" "${sentinel_cli_auth[@]}" -p 26379 \
              sentinel get-master-addr-by-name mymaster | sed -n '1p' || true)
            master_port=$(docker exec "${container_prefix}-26379" "${{ matrix.cli_command }}" "${sentinel_cli_auth[@]}" -p 26379 \
              sentinel get-master-addr-by-name mymaster | sed -n '2p' || true)
            replica_role=$(docker exec "${container_prefix}-replica" "${{ matrix.cli_command }}" "${redis_cli_auth[@]}" -p 6381 \
              info replication | sed -n 's/^role://p' | tr -d '\r' || true)
            if [ "$master_host" = '127.0.0.1' ] \
              && [ "$master_port" = '6380' ] \
              && [ "$replica_role" = 'slave' ]; then
              break
            fi
            test "$attempt" -lt 30 || {
              echo "${{ matrix.name }} Sentinel topology did not become ready" >&2
              exit 1
            }
            sleep 1
          done

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci

      - name: Run ${{ matrix.name }} Sentinel editor data tests
        env:
          TEST_REDIS_SENTINEL: 'true'
          TEST_REDIS_SENTINEL_NAME: 'mymaster'
          TEST_REDIS_SENTINEL_NODES: '127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381'
          TEST_REDIS_SENTINEL_TRANSIENT_CONTAINER: '${{ matrix.name }}-sentinel-${{ matrix.auth }}-26379'
          TEST_REDIS_PREFIX: 'ci:editor-data-sentinel:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: |
          echo "Running ${{ matrix.name }} Sentinel editor-data tests"
          npm run tests -- --runInBand ../tests/redis

      - name: Run ${{ matrix.name }} Sentinel promotion and reconnect integration test
        env:
          TEST_REDIS_SENTINEL: 'true'
          TEST_REDIS_SENTINEL_NAME: 'mymaster'
          TEST_REDIS_SENTINEL_NODES: '127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381'
          TEST_REDIS_TOPOLOGY_REQUIRED: 'true'
          TEST_REDIS_SENTINEL_PRIMARY_CONTAINER: '${{ matrix.name }}-sentinel-${{ matrix.auth }}-primary'
          TEST_REDIS_SENTINEL_REPLICA_PORT: '6381'
          TEST_REDIS_PREFIX: 'ci:editor-data-sentinel-failover:${{ matrix.name }}:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: npm run tests -- --runInBand ../tests/redis/editorDataRedis.topology.tests.js

      - name: Clean up ${{ matrix.name }} Sentinel topology
        if: always()
        run: |
          docker rm -f \
            "${{ matrix.name }}-sentinel-${{ matrix.auth }}-primary" \
            "${{ matrix.name }}-sentinel-${{ matrix.auth }}-replica" \
            "${{ matrix.name }}-sentinel-${{ matrix.auth }}-26379" \
            "${{ matrix.name }}-sentinel-${{ matrix.auth }}-26380" \
            "${{ matrix.name }}-sentinel-${{ matrix.auth }}-26381" || true
