name: Service unit tests
on:
  push:
    branches:
      - '**'
    paths:
      - '**.js'
      - '!tests/integration/**'
      - '!DocService/sources/databaseConnectors/**'
jobs:
  unit-tests:
    name: Service unit tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Caching dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json
            ./FileConverter/npm-shrinkwrap.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci
          npm --prefix FileConverter ci

      - name: Run Jest
        run: npm run "unit tests"

      - name: Run Redis editor-data tests
        env:
          TEST_REDIS_PREFIX: 'ci:unit-editor-data:${{ github.run_id }}:${{ github.run_attempt }}:'
        run: npm run tests -- --runInBand ../tests/redis
