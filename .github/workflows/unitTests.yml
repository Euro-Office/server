name: Service unit tests
# On pull requests also checks how much of the changed lines in the services' sources the tests
# cover (see tests/jest.config.js). The database connectors and storages are left out: the database
# and storage workflows test them.
on:
  pull_request:
    paths:
      - '**.js'
      - '**/package.json'
      - '**/npm-shrinkwrap.json'
      - '.github/workflows/unitTests.yml'
      - '!tests/integration/**'
      - '!DocService/sources/databaseConnectors/**'
  push:
    branches:
      - '**'
    paths:
      - '**.js'
      - '**/package.json'
      - '**/npm-shrinkwrap.json'
      - '.github/workflows/unitTests.yml'
      - '!tests/integration/**'
      - '!DocService/sources/databaseConnectors/**'
jobs:
  unit-tests:
    name: Service unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Caching dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            ./npm-shrinkwrap.json
            ./Common/npm-shrinkwrap.json
            ./DocService/npm-shrinkwrap.json
            ./FileConverter/npm-shrinkwrap.json
            ./SpellChecker/npm-shrinkwrap.json
            ./Metrics/npm-shrinkwrap.json
            ./AdminPanel/server/package-lock.json

      - name: Install modules
        run: |
          npm ci
          npm --prefix Common ci
          npm --prefix DocService ci
          npm --prefix FileConverter ci
          npm --prefix Metrics ci
          npm --prefix AdminPanel/server ci
          # Without nodehun's native build, which fails from its git source:
          # tests mock it (jest.mock('nodehun', factory, {virtual: true}))
          npm --prefix SpellChecker ci --ignore-scripts

      - name: Run Jest
        run: npm run "unit tests" -- --coverage

      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        uses: Euro-Office/.github/actions/diff-coverage@c6be61e1c3cc63761a8a70c71fad268bf9ee434e # main
        with:
          reports: coverage/lcov.info
          fail-under: 80
          args: --exclude '*/databaseConnectors/*' '*/storage/*'
